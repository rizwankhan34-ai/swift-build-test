name: Build Test
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Setup Remote Access
        run: |
          brew install tailscale
          brew install --cask deskpad
          sudo brew services start tailscale
          sleep 5
          sudo tailscale up --authkey=${{ secrets.NGROK_AUTH_TOKEN }} --ssh --timeout=15s
          sudo xattr -cr /Applications/DeskPad.app
          open -a DeskPad
          sleep 3
          echo "runner:${{ secrets.VNC_USER_PASSWORD }}" | sudo chpasswd
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -users runner -privs -all -restart -agent
          caffeinate -dimsu &
          echo "YOUR CLOUD MAC IP ADDRESS IS:"
          tailscale ip -4
          sleep 21000







