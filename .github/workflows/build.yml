name: Build Test
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Setup Remote Access
        run: |
          brew install tailscale
          sudo brew services start tailscale
          sleep 5
          sudo tailscale up --authkey=${{ secrets.NGROK_AUTH_TOKEN }} --ssh
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -clientopts -setvnclegacy -vnclegacy yes -clientopts -setvncpw -vncpw "${{ secrets.VNC_PASSWORD }}" -restart -agent -privs -all
          caffeinate -u -t 21000 &
          osascript -e 'tell application "System Events" to keystroke return' || true
          echo "YOUR CLOUD MAC IP ADDRESS IS:"
          tailscale ip -4
          sleep 21000
