name: Build Test
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Setup Remote Access
        run: |
          brew install tailscale
          sudo brew services start tailscale
          sleep 5
          sudo tailscale up --authkey=${{ secrets.NGROK_AUTH_TOKEN }} --ssh
          NM_URL=$(curl -s https://brew.sh | python3 -c "import sys, json; print(json.load(sys.stdin)['url'])")
          curl -L "$NM_URL" -o nomachine.dmg
          hdiutil attach nomachine.dmg -nobrowse -mountpoint /Volumes/NoMachine
          sudo installer -pkg /Volumes/NoMachine/NoMachine.pkg -target /
          hdiutil detach /Volumes/NoMachine
          mkdir -p ~/.nx/config ~/.ssh
          ssh-keygen -t rsa -b 2048 -f ~/.nx/config/id_rsa -N ""
          cat ~/.nx/config/id_rsa.pub >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          sudo /etc/NX/nxserver --startup
          echo "=== COPY THIS PRIVATE KEY FOR NOMACHINE ==="
          cat ~/.nx/config/id_rsa
          echo "YOUR CLOUD MAC IP ADDRESS IS:"
          tailscale ip -4
          sleep 21000
