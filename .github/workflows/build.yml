name: Build Test
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Setup Remote Access
        run: |
          brew install tailscale
          brew install --cask rustdesk
          sudo brew services start tailscale
          sleep 5
          sudo tailscale up --authkey=${{ secrets.NGROK_AUTH_TOKEN }} --ssh
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --install-service || true
          open -a RustDesk
          sleep 8
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --password "${{ secrets.VNC_PASSWORD }}"
          echo "YOUR CLOUD MAC TAILSCALE IP IS:"
          tailscale ip -4
          echo "YOUR RUSTDESK ID IS:"
          /Applications/RustDesk.app/Contents/MacOS/RustDesk --get-id
          sleep 21000





